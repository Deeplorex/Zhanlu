[package]
name = "zhanlu"
version = "0.1.0"
license = "Apache-2.0"
description = "湛卢 Zhanlu — 纯本地 PDF/OFD 工具箱"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
tauri-plugin-single-instance = "2"

[lib]
name = "zhanlu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
